version: 1
name: team-activity
description: Summarize Slack activity per person over a timeframe. Optionally scope to a Slack team/usergroup. Outputs a markdown file.
prompt: |-
  # Team Activity

  Generate a per-person summary of Slack activity over a timeframe. Outputs a markdown file with one section per person.

  ## Inputs

  - **team** (optional) — a Slack usergroup handle (e.g. `@engineers`, `@design`). When provided, only summarize members of that group. When omitted, summarize all non-bot workspace users.
  - **timeframe** (optional) — how far back to look. Accepts relative formats like `24h`, `3d`, `7d`, `2w`, `1m`. Defaults to **today** (the current local calendar day — midnight to now).
  - **include_weekends** (optional) — whether to include Saturday/Sunday activity. Defaults to **false**. When false, any messages from weekend days within the timeframe are excluded.

  ## Auth

  `SLACK_BOT_TOKEN` is read from the environment — Barry resolves it from the
  barry's configured source (vault, keychain, or a literal value):

  ```bash
  barry vault set-env <barry> SLACK_BOT_TOKEN <token> --source vault
  ```

  Used for all API calls: `conversations.list`, `conversations.history`,
  `users.list`, `usergroups.*`. Do not read it out of a `.env` file — that
  bypasses the credential chain and will not pick up a rotated secret.

  ## Workflow

  ### Step 1: Determine the time range

  Compute the `oldest` unix timestamp for the `conversations.history` API.

  **Default (today):** Midnight local time today.

  ```bash
  OLDEST=$(date -j -f "%Y-%m-%d %H:%M:%S" "$(date +%Y-%m-%d) 00:00:00" +%s)
  ```

  **Relative timeframe:** Calculate from the timeframe string.

  ```bash
  # Examples:
  # 3d  -> OLDEST=$(date -v-3d -j -f "%H:%M:%S" "00:00:00" +%s)
  # 7d  -> OLDEST=$(date -v-7d -j -f "%H:%M:%S" "00:00:00" +%s)
  # 2w  -> OLDEST=$(date -v-14d -j -f "%H:%M:%S" "00:00:00" +%s)
  # 1m  -> OLDEST=$(date -v-1m -j -f "%H:%M:%S" "00:00:00" +%s)
  ```

  ### Step 2: Resolve users

  Build a user ID → name map for filtering later.

  **If a team/usergroup was specified:**

  1. List usergroups to find the ID:

  ```bash
  curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
    "https://slack.com/api/usergroups.list?include_users=false" | \
    jq -r '.usergroups[] | select(.handle == "<handle>") | .id'
  ```

  2. Get the usergroup's member IDs:

  ```bash
  curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
    "https://slack.com/api/usergroups.users.list?usergroup=<GROUP_ID>" | \
    jq -r '.users[]'
  ```

  3. Resolve each to a name with `users.info`.

  **If no team was specified:**

  ```bash
  curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
    "https://slack.com/api/users.list?limit=500" | \
    jq '[.members[] | select(.is_bot == false and .deleted == false and .id != "USLACKBOT") | {id, name, real_name}]'
  ```

  Store as a map: `{ user_id: real_name }`. This is used to filter messages and attribute them to people.

  ### Step 3: Iterate all channels and collect messages by person

  This is the core data collection step. Do NOT use the search API — iterate channels directly.

  1. **List all channels** the bot can see:

  ```bash
  curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
    "https://slack.com/api/conversations.list?types=public_channel,private_channel&limit=1000"
  ```

  Handle pagination (`response_metadata.next_cursor`) if needed.

  2. **For each channel**, fetch messages within the time range:

  ```bash
  curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
    "https://slack.com/api/conversations.history?channel=<CHANNEL_ID>&oldest=<OLDEST>&limit=200"
  ```

  Handle pagination for busy channels. Skip channels where the bot gets `not_in_channel` — don't try to join.

  3. **For each message**, check:
     - `msg.user` is in the user map (skip bots, apps, unknown users)
     - `msg.subtype` is absent or null (skip join/leave/topic/etc system messages)
     - If `include_weekends` is false, check the timestamp — skip messages where day of week is Saturday or Sunday

  4. **Accumulate into a per-user map:**

  ```
  {
    user_id: {
      name: "Alice Johnson",
      channels: {
        "channel_name": [
          { text: "...", ts: "...", channel: "..." },
          ...
        ]
      }
    }
  }
  ```

  This gives you every human message across every channel in a single pass.

  **Rate limiting:** The bot token tier allows ~50 req/s. With ~100-200 channels, this completes quickly. If you hit rate limits (`429` responses), back off per the `Retry-After` header.

  ### Step 4: If team/usergroup was specified, filter

  After collecting all messages, filter the per-user map to only include user IDs that are members of the specified usergroup.

  ### Step 5: Summarize and write the markdown file

  For each person with activity, write a section. **Summarize, don't list every message.**

  **What to capture per person:**
  - Which channels they were active in (with rough counts)
  - Key topics/themes of their messages (group related messages together)
  - Rough volume (e.g. "~15 messages across 3 channels")
  - Notable items: questions asked, decisions made, links shared, announcements

  **Sort people** by message count descending.

  **Skip people with zero messages** in the timeframe — don't include empty sections.

  ### Step 6: Write the output file

  Write the markdown to a file. Use a descriptive filename:

  ```
  team-activity-YYYY-MM-DD.md          # for today
  team-activity-YYYY-MM-DD--YYYY-MM-DD.md  # for a date range
  ```

  Write it to the current working directory (or `/tmp` if no better location).

  ## Output format

  ```markdown
  # Team Activity: <date or date range>

  <Timeframe description, e.g. "Today (Wed Jul 30, 2026)" or "Jul 23 - Jul 30, 2026">
  <Scope, e.g. "All users" or "Team: @engineers (8 members)">
  <Weekend note if applicable, e.g. "Excluding weekends">

  ---

  ## Alice Johnson

  ~12 messages across #engineering, #product, #general

  - **Deployment discussion** — coordinated the v2.4 rollout in #engineering, confirmed staging passed checks
  - **Product review** — shared feedback on the onboarding flow redesign in #product
  - **Standup** — posted daily standup in #engineering

  ---

  ## Bob Smith

  ~5 messages in #engineering

  - **Bug triage** — flagged a race condition in the auth service, linked the Sentry issue
  - **Code review** — discussed API naming conventions on a PR thread

  ---

  ...
  ```

  ## Notes

  - **Channel iteration, not search.** The search API has index lag, username matching issues, and result caps. Iterating `conversations.history` with the bot token is complete and reliable.
  - **Bot filtering:** Only include messages where `msg.user` matches a known human user ID from step 2. This automatically excludes all bots, apps, and webhooks.
  - **Thread replies** appear as separate messages in `conversations.history` only if `reply_broadcast` is true. Thread-internal replies don't appear in channel history by default — this is fine, it avoids double-counting.
  - **For large teams (>15 people)**, use the Agent tool to parallelize the summarization step — the channel iteration itself is fast, but synthesizing 30+ people's messages benefits from parallel agents.
  - The summary should be useful for a manager or team lead to quickly understand what happened. Focus on substance, not noise.
requires:
  tools: [Bash, Read, Write, Agent]
