packages:
  # The Slack API client this bag's tools, slack-app, and the vantage-slack
  # bag all import. It moved here from the barry monorepo, where every consumer
  # was a bag (docs/bags.md, "Where a package belongs"). vantage-slack reaches
  # it from its own repo as link:../slack/packages/slack.
  - packages/slack
  - slack-app

allowBuilds:
  esbuild: true
  # better-sqlite3 is a native module: without an approved build step its
  # binding is never compiled, and every test that opens the mention store
  # fails at import with "Could not locate the bindings file".
  better-sqlite3: true
