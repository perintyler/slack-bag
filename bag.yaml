name: slack
description: Slack messaging, search, and analytics tools

bags:
  - slackbot
  - slack-app

# Offered when the barry has not configured its own notifier. Takes no
# target — the DM channel is resolved from the user's Slack identity — so it
# works the moment the bag's tokens are set.
default_notifier:
  tool: send_slack_message_to_self

tools:
  entry: tools.ts
  env:
    - SLACK_BOT_TOKEN
    - SLACK_USER_TOKEN
    - ANTHROPIC_API_KEY
    # get_barry_mentions reads the slack-app service's /api/mentions, which is
    # guarded by this shared secret — the route is published on the tunnel, so
    # it cannot be left open to the internet the way a loopback-only one could.
    - BARRY_SECRET

# Read everything, write only to yourself.
#
# `bags: [slack]` is spelled out on purpose and must NOT be widened to this
# bag's own name-as-composition. The manifest's `bags:` list composes
# `slackbot`, whose namespace carries `slack_post_message` (any channel) and
# `slack_open_conversation` (opens a DM with anyone) — granting the parent
# auto-trait would hand those over and defeat the point of this trait. Only
# `generateAutoTraits` expands composition; a hand-written `bags:` is copied
# verbatim into `namespaces`, which is exactly the narrowness wanted here.
#
# `readwrite`, not `read`: `send_slack_message_to_self` is a write tool, and
# `filterTools` drops write tools under a `read` grant. The narrowing is the
# bound's job instead — `slack-self-dm-only` denies the three write tools that
# accept a destination and leaves the self-DM one, which takes no destination
# at all (the channel comes from `auth.test` at runtime, so the caller cannot
# redirect it).
traits:
  slack-me:
    description: Read Slack, and DM only yourself
    access: readwrite
    bags: [slack]
    bounds: [slack-self-dm-only]

verbs:
  notify:
    synonyms: [alert, ping, inform, message]
    instruction: >-
      Post a brief update to the right channel with send_slack_message.
      Keep it to 1-2 sentences; use thread replies for follow-ups to avoid
      channel noise.
  find:
    synonyms: [search, look-up, research]
    instruction: >-
      Use get_relevant_messages to surface discussions, decisions, and
      context across channels. Include thread context when a conversation
      spans multiple replies.

nouns:
  messages:
    synonyms: [message, chat, conversation, thread]
    description: >-
      Slack messages in channels, threads, and DMs. Searchable by content,
      channel, author, and timeframe with semantic relevance ranking.
    getters: [get_relevant_messages, get_channel_history, get_my_messages, get_barry_mentions]
    setters: [send_slack_message, send_message_as_user, send_slack_message_to_self]
    skills: [pretty-slack, slack-myself, slack-unread]
  channels:
    synonyms: [channel, room, workspace]
    description: Slack channels the bot can access — public, private, or DM.
    getters: [list_slack_channels]
    skills: [find-slack-channel-id, check-slack]
  activity:
    synonyms: [activity, report, summary, standup, recap]
    description: >-
      Per-person Slack activity summaries over a timeframe. Scoped to a
      team/usergroup or all workspace users. Outputs markdown.
    getters: [get_my_messages, get_relevant_messages]
    skills: [team-activity]

# Recurring work. Installed by `./scripts/launchd/setup` in the Barry repo;
# `barry job list` shows status and `barry job logs` tails output.
#
# Disabled by default: it runs a real agent session on a schedule and writes a
# report. Set `enabled: true` and re-run setup to turn it on.
jobs:
  weekly-digest:
    description: Summarize the last 7 days of team Slack activity
    command: bash
    args: ["jobs/weekly-digest"]
    working-directory: "."
    enabled: false
    schedule:
      hour: 9
      minute: 0
      weekday: 1
